<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Quick App</title>

<style>
  h1 { 
    text-align: center;
  }
  body {
    background-color: #111;
    color: #aaa;
    width: 1130px;
    max-width:100%;
    margin: auto;
    padding: 3rem 0;
    font-family: system-ui;
  }
  textarea {
    width: -webkit-fill-available;
    height: 100px;
    background-color: black;
    color: white;
    border-radius: 8px;
    padding: 1rem;
  }
  .custom-btn {
    background-color: black;
    align-content: center;
    align-self: center;
    color: white;
    padding: 4px;
    cursor: pointer;
    border-radius: 4px;
  }
  #responseContent {
    border: 2px solid #000;
    border-radius: 12px;
    height: 400px;
    background-color: #0c0c0c;
    padding: 1rem;
  }
  #submitForm {
    padding: 1rem;
    justify-self: center;
    width: 100%;
  }
  #fileUploadDisplay {display: inline-flex}
  /*hide default ugly file upload btn*/
  #fileUpload {display:none;}
  #submitBtn {float:right;}
  footer {
    margin-top: 2rem;
  }
</style>
  </head>

  <body>
    <h1>Quick App Title</h1>
    <div id="responseContent">The response will be displayed here once it's ready.</div>
    <div id="submitForm">
      <form 
        id="myForm" 
        enctype="multipart/form-data" 
      >
        <textarea name="textUpload" placeholder="Enter your idea about the so and so here..."></textarea>

        <div id="fileUploadDisplay">
          <label for="fileUpload" class="custom-btn">Select img</label>
          <input
            accept="image/png, image/jpeg"
            type="file" 
            id="fileUpload" 
            name="fileUpload"
          />
          <p id="fileNameLabel">No file selected</p>
        </div>

        <button class="custom-btn" id="submitBtn" type="submit">Submit your image!</button>
      </form>
    </div>
  </body>
  <footer>
    2026 Jeane Ramos
  </footer>
</html>

<script>
  console.log('script loaded!');

  const form = document.querySelector('#myForm');
  const fileUpload = document.querySelector('#fileUpload');
  const fileNameLabel = document.querySelector("#fileNameLabel");


  // update file label if input changes
  fileUpload.addEventListener('change', (e) => {
    // check if file was added
    if(fileUpload.files.length > 0){
      fileNameLabel.textContent = fileUpload.files[0].name
    }
  })


  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // stop page reload

    // grabs all inputs using their 'name'
    const formData = new FormData(form);
    console.log('formData', Object.fromEntries(formData));

    // check if inputs are valid, set error msg if not
    let response;
    try {
      response = await fetch('/api/generate-response', {
        method: 'POST',
        body: formData
      });
    } catch (err) {
      console.error('Error: ', err);
    }

    let body;
    try {
      body = await response.body;
      console.log('body', body)
    } catch (err) {
      console.log('body catch', err)
    }

  })
  
</script>
