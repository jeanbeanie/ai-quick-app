<!DOCTYPE html>
<style>
  h1 { 
    text-align: center;
  }
  body {
    background-color: #111;
    color: #aaa;
    width: 80%;
    margin: auto;
    padding: 3rem 0;
    font-family: system-ui;
  }
  textarea {
    width: -webkit-fill-available;
    height: 100px;
    background-color: black;
    color: white;
    border-radius: 8px;
    padding: 1rem;
  }
  .custom-btn {
    background-color: black;
    color: white;
    padding: 4px;
    cursor: pointer;
    border-radius: 4px;
  }
  #responseContent {
    border: 2px solid #000;
    border-radius: 12px;
    height: 400px;
    background-color: #0c0c0c;
    padding: 1rem;
  }
  #submitForm {
    padding: 1rem;
    justify-self: center;
    width: 100%;
  }
  #fileUpload {display:none;}
  footer {
    margin-top: 2rem;
  }
</style>

<html>
  <body>
    <h1>Quick App Title</h1>
    <div id="responseContent">The response will be displayed here once it's ready.</div>
    <div id="submitForm">
      <form 
        id="myForm" 
        enctype="multipart/form-data" 
      >

        <textarea name="textUpload">Enter your idea about the so and so here...</textarea>

        <label for="fileUpload" class="custom-btn">Select img</label>
        <input
          accept="image/png, image/jpeg"
          type="file" 
          id="fileUpload" 
          name="fileUpload"
        />

        <button type="submit">Submit img!</button>
      </form>
    </div>
  </body>
  <footer>
    2026 Jeane Ramos
  </footer>
</html>

<script>
  console.log('JS loaded!');

  const form = document.querySelector('#myForm');

  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // stop page reload

    // grabs all inputs using their 'name'
    const formData = new FormData(form);
    console.log('formData', Object.fromEntries(formData));
    let response;
    try {
      response = await fetch('/api/generate-response', {
        method: 'POST',
        body: formData
      });
    } catch (err) {
      console.error('Error: ', err);
    }

    if(response && response.ok){
      console.log('response from backend: ', response)
    } else {
      console.log('Response error :', response)
    }
  })
  
</script>
