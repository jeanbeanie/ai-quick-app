<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Quick App</title>

<style>
  h1 { 
    text-align: center;
  }
  body {
    background-color: #111;
    color: #aaa;
    width: 1130px;
    max-width:100%;
    margin: auto;
    padding: 3rem 0;
    font-family: system-ui;
  }
  textarea {
    width: -webkit-fill-available;
    height: 100px;
    background-color: black;
    color: white;
    border-radius: 8px;
    padding: 1rem;
  }
  .custom-btn {
    background-color: black;
    align-content: center;
    align-self: center;
    color: white;
    padding: 4px;
    cursor: pointer;
    border-radius: 4px;
  }
  #responseContent {
    border: 2px solid #000;
    border-radius: 12px;
    height: 400px;
    background-color: #0c0c0c;
    padding: 1rem;
    overflow: auto;
    white-space: pre-wrap;
  }
  #submitForm {
    padding: 1rem;
    justify-self: center;
    width: 100%;
  }
  #imageInputDisplay {display: inline-flex}
  /*hide default ugly file upload btn*/
  #imageInput {display:none;}
  #submitBtn {float:right;}
  footer {
    margin-top: 2rem;
  }
</style>
  </head>

  <body>
    <h1>AI Quick App</h1>
    <div id="responseContent">The response will be displayed here once it's ready.</div>
    <div id="submitForm">
      <form 
        id="myForm" 
        enctype="multipart/form-data" 
      >
        <textarea 
          name="textInput" 
          placeholder="Add some text to go with your image (optional)..."
        ></textarea>

        <div id="imageInputDisplay">
          <label for="imageInput" class="custom-btn">Select img</label>
          <input
            accept="image/png, image/jpeg"
            type="file" 
            id="imageInput" 
            name="imageInput"
          />
          <p id="imageSelectedDisplay">No file selected</p>
        </div>

        <button class="custom-btn" id="submitBtn" type="submit">Submit!</button>
      </form>
    </div>
  </body>
  <footer>
    2026 Jeane Ramos
  </footer>
</html>

<script>
  console.log('script loaded!');

  const form = document.querySelector('#myForm');
  const imageInput = document.querySelector('#imageInput');
  const imageSelectedDisplay = document.querySelector("#imageSelectedDisplay");
  const responseContent = document.querySelector("#responseContent");
  const submitBtn = document.querySelector("#submitBtn");

  // update file label if input changes
  imageInput.addEventListener('change', (e) => {
    // check if file was added
    if(imageInput.files.length > 0){
      imageSelectedDisplay.textContent = imageInput.files[0].name
    }
  })

  // main form handler
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // stop page reload

    responseContent.textContent = 'Thinking...';
    submitBtn.disabled = true;

    // grabs all inputs using their 'name'
    const formData = new FormData(form);
    console.log('formData', Object.fromEntries(formData));

    // check if inputs are valid, set error msg if not
    try {
      const response = await fetch('/api/generate-response', {
        method: 'POST',
        body: formData
      });
      responseContent.textContent = await response.text();
    } catch (err) {
      responseContent.textContent = `Request failed: ${err}`
    } finally {
      submitBtn.disabled = false;
    }

  })
  
</script>
