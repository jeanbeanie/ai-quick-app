<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Quick App</title>

<style>
  h1 { 
    text-align: center;
  }
  body {
    background-color: #111;
    color: #aaa;
    width: 1130px;
    max-width:100%;
    margin: auto;
    padding: 3rem 0;
    font-family: system-ui;
  }
  textarea {
    width: -webkit-fill-available;
    height: 100px;
    background-color: black;
    color: white;
    border-radius: 8px;
    padding: 1rem;
  }
  .custom-btn {
    background-color: black;
    align-content: center;
    align-self: center;
    color: white;
    padding: 4px;
    cursor: pointer;
    border-radius: 4px;
  }
  #responseContent {
    border: 2px solid #000;
    border-radius: 12px;
    height: 400px;
    background-color: #0c0c0c;
    padding: 1rem;
    overflow: auto;
    white-space: pre-wrap;
  }
  #submitForm {
    padding: 1rem;
    justify-self: center;
    width: 100%;
  }
  #imageInputDisplay {display: inline-flex}
  /*hide default ugly file upload btn*/
  #imageInput {display:none;}
  #submitBtn {float:right;}
  footer {
    margin-top: 2rem;
  }
</style>
  </head>

  <body>
    <h1>AI Quick App</h1>
    <div id="responseContent">The response will be displayed here once it's ready.</div>
    <div id="submitForm">
      <form 
        id="myForm" 
        enctype="multipart/form-data" 
      >
        <textarea 
          name="textInput" 
          id="textInput"
          aria-label="Text to go with your image"
          placeholder="Add some text to go with your image (optional)..."
        ></textarea>

        <div id="imageInputDisplay">
          <label for="imageInput" class="custom-btn">Select img</label>
          <input
            accept="image/png, image/jpeg"
            type="file" 
            id="imageInput" 
            name="imageInput"
          />
          <p id="imageSelectedDisplay">No file selected</p>
        </div>

        <button class="custom-btn" id="submitBtn" type="submit">Submit!</button>
      </form>
    </div>
    <footer>
      2026 Jeane Ramos
    </footer>
    <script src="/script.js"></script>
  </body>
</html>
