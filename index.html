<!DOCTYPE html>
<style>
  h1 { 
    text-align: center;
  }
  body {
    background-color: #111;
    color: #aaa;
    width: 80%;
    margin: auto;
    padding: 3rem 0;
  }
  textarea {
    width: -webkit-fill-available;
    height: 100px;
    background-color: black;
    color: white;
  }
  .custom-btn {
    background-color: black;
    color: white;
    padding: 4px;
    cursor: pointer;
    border-radius: 4px;
  }
  #responseContent {
    border: 1px solid #333;
    height: 400px;
  }
  #submitForm {
    padding: 1rem;
    justify-self: center;
    width: 100%;
  }
  #fileUpload {display:none;}
  footer {
    margin-top: 2rem;
  }
</style>

<html>
  <body>
    <h1>Quick App Title</h1>
    <div id="responseContent"></div>
    <div id="submitForm">
      <form id="myForm" method="post" enctype="multipart/form-data" accept="image/png, image/jpeg">

        <textarea name="textUpload"></textarea>

        <label for="fileUpload" class="custom-btn">Select img</label>
        <input type="file" id="fileUpload" name="fileUpload"/>

        <button type="submit">Submit img!</button>
      </form>
    </div>
  </body>
  <footer>
    2026 Jeane Ramos
  </footer>
</html>

<script>
  console.log('JS loaded.');

  const form = document.querySelector('#myForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    console.log('formData', Object.fromEntries(formData));
  })
  
</script>
